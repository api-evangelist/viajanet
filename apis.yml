name: Viajanet
description: >-
  Viajanet is a Brazilian online travel agency (OTA) operated within the Despegar
  group, selling flights, hotels, vacation packages, car rentals and travel
  insurance to consumers in Brazil through www.viajanet.com.br. It was surfaced as
  a portfolio company of Redpoint Ventures and added to the API Evangelist network
  for enrichment. Viajanet publishes no public developer API, SDK, or developer
  portal; the enrichment pass captured its live security surface (a published
  security.txt with a Bugcrowd private bug bounty program run by the Despegar
  application-security team) and its domain-security posture.
